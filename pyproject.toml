[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[project]
name = "xuanji-tables"
version = "0.3.0"
description = "XuanJi (璇玑): unified question answering over tables and databases — disambiguation, agentic solving with self-consistency, and self-criticism refinement"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
keywords = ["tableQA", "text-to-sql", "table reasoning", "LLM agents", "self-consistency", "critic"]
authors = [{ name = "XuanJi Developers" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Database",
]
dependencies = [
    "pandas>=1.5",
    "cloudpickle>=2.0",
]

[project.optional-dependencies]
fuzzy = ["rapidfuzz>=3.0"]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
xuanji = "xuanji.cli:main"

[project.urls]
Homepage = "https://github.com/ruochunjin/xuanji"
Issues = "https://github.com/ruochunjin/xuanji/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/xuanji"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501", "E731"]

[tool.ruff.lint.per-file-ignores]
# Ported prompt templates: significant whitespace and research-verbatim text.
"src/xuanji/prompts/solve.py" = ["W291", "W293", "E501"]
"src/xuanji/prompts/refine.py" = ["W291", "W293"]
# Ported research modules preserved close to the verified originals.
"src/xuanji/agents/refiner.py" = ["W291"]
"src/xuanji/agents/critic.py" = ["W291"]
"src/xuanji/execution.py" = ["E722"]
"src/xuanji/normalize.py" = ["E722"]
